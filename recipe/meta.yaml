{% set name = "napari-cellseg3d" %}
{% set version = "0.2.5" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1c87d6e8d6e232016914c8778f718166c480496ee4cd28735619fae37feba186

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  script_env:
    - QT_QPA_PLATFORM=offscreen

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel

  run:
    - python >={{ python_min }}
    - imagecodecs >=2023.3.16
    - itk
    - matplotlib-base >=3.5
    - monai >=0.9
    - einops
    - nibabel
    - napari >=0.7.1
    - numpy
    - pyclesperanto
    - pytorch >=1.11
    - qtpy
    - scikit-image >=0.19.2
    - tifffile
    - tqdm

test:
  imports:
    - napari_cellseg3d

  commands:
    - python -m npe2 validate napari-cellseg3d

  requires:
    - python {{ python_min }}
    - npe2

about:
  home: https://github.com/AdaptiveMotorControlLab/CellSeg3D
  summary: Plugin for cell segmentation in 3D
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - C-Achard
    - jaimergp
